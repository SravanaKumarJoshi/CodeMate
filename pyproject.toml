[project]
name = "codemate"
version = "2.0.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "chromadb>=0.5.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.2.0",
    "openai>=1.30.0",
    "sqlalchemy>=2.0.0",
    "pyjwt>=2.8.0",
    "httpx>=0.27.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[tool.vercel]
entrypoint = "api.index:app"
